name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-content:
    name: Validate prayer content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate prayers.json
        run: python3 Scripts/validate_prayers.py

      - name: Check catalog export is in sync
        run: |
          python3 Scripts/export_catalog.py
          if ! git diff --quiet -- Content/; then
            echo "::error::Content/ CSVs are out of sync with prayers.json. Run 'python3 Scripts/export_catalog.py' and commit the result."
            git --no-pager diff --stat -- Content/
            exit 1
          fi
          echo "Catalog export is in sync."

  build-and-test:
    name: Build & test (macOS, unit + UI)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          # Runner Xcode/simulator versions drift over time, so discover a
          # real, available iPhone destination rather than hardcoding a
          # device name that may not exist on this runner's SDK.
          NAME=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/[[:space:]]*$//')
          if [ -z "$NAME" ]; then
            echo "::error::No available iPhone simulator found on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build and test (unit + UI)
        env:
          DESTINATION: platform=iOS Simulator,name=${{ steps.sim.outputs.name }}
        run: ./Scripts/build.sh

      - name: Upload build/test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: BuildReports/
          if-no-files-found: warn
